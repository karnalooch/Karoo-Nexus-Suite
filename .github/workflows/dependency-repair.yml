name: One-shot dependency repair

on:
  push:
    branches:
      - chore/platform-engineering-baseline
    paths:
      - ".github/workflows/dependency-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/platform-engineering-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Refresh vulnerable npm dependencies
        run: |
          set -euo pipefail
          npm install next@16.2.11 eslint-config-next@16.2.11 --save-exact
          npm audit fix --package-lock-only || true
          npm run lint
          npm run build
          npm audit --audit-level=high || true

      - name: Refresh vulnerable Rust lock entries
        run: |
          set -euo pipefail
          cargo update --manifest-path src-tauri/Cargo.toml -p openssl --precise 0.10.79
          cargo update --manifest-path src-tauri/Cargo.toml -p rustls-webpki --precise 0.103.13

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Validate Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Commit generated lockfile repair
        run: |
          set -euo pipefail
          git add package.json package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: refresh vulnerable dependencies"
          git push origin HEAD:chore/platform-engineering-baseline
