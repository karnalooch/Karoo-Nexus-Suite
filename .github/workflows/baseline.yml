name: Nexus CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      rust: ${{ steps.classify.outputs.rust }}
      security: ${{ steps.classify.outputs.security }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          frontend=false
          rust=false
          security=false

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
          elif [[ "${EVENT_NAME}" == "push" &&
                  -n "${PUSH_BEFORE_SHA}" &&
                  "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff --name-only "${PUSH_BEFORE_SHA}" "${CURRENT_SHA}")"
          else
            changed_files="__ALL__"
          fi

          if [[ "${changed_files}" == "__ALL__" ]]; then
            frontend=true
            rust=true
            security=true
          else
            while IFS= read -r path; do
              [[ -z "${path}" ]] && continue

              case "${path}" in
                *.md|docs/*|LICENSE|LICENSE.*|THIRD-PARTY-NOTICES.md)
                  ;;
                src/*|src/**/*|public/*|public/**/*|package.json|package-lock.json|tsconfig.json|next.config.*|eslint.config.*|postcss.config.*|components.json)
                  frontend=true
                  ;;
                src-tauri/*|src-tauri/**/*)
                  rust=true
                  ;;
                .github/*|.github/**/*)
                  frontend=true
                  rust=true
                  security=true
                  ;;
                *)
                  # Unknown non-documentation paths fail safe through both build lanes.
                  frontend=true
                  rust=true
                  security=true
                  ;;
              esac

              case "${path}" in
                package.json|package-lock.json|src-tauri/Cargo.toml|src-tauri/Cargo.lock|.github/*|.github/**/*)
                  security=true
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          {
            echo "frontend=${frontend}"
            echo "rust=${rust}"
            echo "security=${security}"
          } >> "${GITHUB_OUTPUT}"

          echo "frontend=${frontend}"
          echo "rust=${rust}"
          echo "security=${security}"

  repo-policy:
    name: Repository policy
    permissions:
      contents: read
    uses: karnalooch/engineering-platform/.github/workflows/reusable-repo-policy.yml@36226a69856450e6f55a9746e9311711cc38a129
    with:
      max_non_lfs_mib: 10
      forbidden_path_components: "node_modules,.next,out,target,dist"

  governance:
    name: Governance policy
    permissions:
      contents: read
    uses: karnalooch/engineering-platform/.github/workflows/reusable-governance.yml@36226a69856450e6f55a9746e9311711cc38a129
    with:
      allow_dependabot_high_risk_without_manual_marker: true
      additional_high_risk_patterns: |
        src-tauri/capabilities/**
        src-tauri/tauri.conf.json
        src-tauri/src/lib.rs
        src-tauri/Cargo.toml
        src-tauri/Cargo.lock
        next.config.ts

  secret-guard:
    name: Secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject obvious private-key material and secret containers
        shell: bash
        run: |
          set -euo pipefail

          failed=0

          private_key_pattern='-----BEGIN ((RSA|EC|DSA|OPENSSH) )?PRIVATE'" KEY-----"
          pgp_key_pattern='-----BEGIN PGP PRIVATE'" KEY BLOCK-----"

          if git grep -I -n -E -- "${private_key_pattern}|${pgp_key_pattern}"
          then
            echo "::error::Private-key material is tracked in the repository."
            failed=1
          fi

          while IFS= read -r path; do
            case "${path,,}" in
              *.pem|*.key|*.p12|*.pfx)
                echo "::error file=${path}::Secret-container file type must not be tracked."
                failed=1
                ;;
            esac
          done < <(git ls-files)

          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi

          echo "secret guard: PASS"

  frontend:
    name: Frontend lint and build
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  dependency-audit:
    name: NPM dependency audit
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Block high and critical npm advisories
        run: npm audit --audit-level=high

  rust:
    name: Rust check
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  security-base:
    name: Security baseline
    permissions:
      contents: read
      security-events: write
    uses: karnalooch/engineering-platform/.github/workflows/reusable-security.yml@36226a69856450e6f55a9746e9311711cc38a129
    with:
      enable_dependency_review: false
      enable_codeql: false
      enable_trivy: true
      enable_sbom: true
      dependency_fail_severity: high
      trivy_severity: "HIGH,CRITICAL"

  codeql:
    name: CodeQL JavaScript/TypeScript
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    permissions:
      contents: read
      security-events: write
    uses: karnalooch/engineering-platform/.github/workflows/reusable-security.yml@36226a69856450e6f55a9746e9311711cc38a129
    with:
      enable_dependency_review: false
      enable_codeql: true
      codeql_languages_json: '["javascript-typescript"]'
      enable_trivy: false
      enable_sbom: false

  aggregate:
    name: Aggregate CI gate
    if: ${{ always() }}
    needs:
      - changes
      - repo-policy
      - governance
      - secret-guard
      - frontend
      - dependency-audit
      - rust
      - security-base
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail closed unless required lanes passed
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_POLICY_RESULT: ${{ needs.repo-policy.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          SECRET_GUARD_RESULT: ${{ needs.secret-guard.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SECURITY_RESULT: ${{ needs.security-base.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          FRONTEND_EXPECTED: ${{ needs.changes.outputs.frontend }}
          SECURITY_EXPECTED: ${{ needs.changes.outputs.security }}
          RUST_EXPECTED: ${{ needs.changes.outputs.rust }}
        run: |
          set -euo pipefail
          failed=0

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "${result}" != "success" ]]; then
              echo "::error::${name}: expected success, got ${result}"
              failed=1
            fi
          }

          require_optional() {
            local name="$1"
            local expected="$2"
            local result="$3"
            if [[ "${expected}" == "true" ]]; then
              require_success "${name}" "${result}"
            elif [[ "${result}" != "skipped" ]]; then
              echo "::error::${name}: expected skipped, got ${result}"
              failed=1
            fi
          }

          require_success "changes" "${CHANGES_RESULT}"
          require_success "repo-policy" "${REPO_POLICY_RESULT}"
          require_success "governance" "${GOVERNANCE_RESULT}"
          require_success "secret-guard" "${SECRET_GUARD_RESULT}"
          require_success "security-base" "${SECURITY_RESULT}"
          require_optional "frontend" "${FRONTEND_EXPECTED}" "${FRONTEND_RESULT}"
          require_optional "dependency-audit" "${SECURITY_EXPECTED}" "${DEPENDENCY_AUDIT_RESULT}"
          require_optional "rust" "${RUST_EXPECTED}" "${RUST_RESULT}"
          require_optional "codeql" "${FRONTEND_EXPECTED}" "${CODEQL_RESULT}"

          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi

          echo "aggregate: PASS"
