name: One-shot dependency preview

on:
  push:
    branches:
      - chore/platform-engineering-baseline
    paths:
      - ".github/workflows/dependency-preview.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/platform-engineering-baseline
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Generate repaired npm lockfile
        run: |
          set -euo pipefail
          npm install next@16.3.3 eslint-config-next@16.3.3 --save-exact
          npm audit fix --package-lock-only || true
          npm run lint
          npm run build
          npm audit --audit-level=high || true

      - name: Upload generated npm manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repaired-npm-manifests-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
